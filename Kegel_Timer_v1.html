<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title data-id="th-modified">Kegel Exercise Timer</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#101a2b;color:#fff;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}main{width:100%;max-width:480px;text-align:center}h1{font-size:26px;font-weight:650;margin:0 0 26px}#phase{font-size:clamp(36px,9vw,60px);font-weight:800;min-height:1.3em}#phase.hold{color:#7ee6bf}#phase.rest{color:#87c8ff}#seconds{font-size:100px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:700;margin:16px 0}#progress{font-size:21px;margin-bottom:12px;color:#d5deeb}#description{color:#bcc8da;font-size:16px;margin-bottom:28px;line-height:1.5}button{border:0;border-radius:16px;padding:17px 26px;font:700 20px system-ui;background:#71e2b7;color:#102035;min-width:145px;margin:5px;cursor:pointer}button.secondary{background:#324257;color:#fff}button:disabled{opacity:.5}#track{height:9px;background:#334359;border-radius:20px;overflow:hidden;margin:20px 0 27px}#fill{height:100%;background:#73debd;width:0%;transition:width .1s linear}.small{font-size:13px;line-height:1.5;color:#aab8cb;margin-top:30px}</style><meta property="og:title" content="Kegel Exercise Timer" data-id="th-modified" ><meta name="description" content="kegel_timer" data-id="th-modified" ><meta property="og:description" content="kegel_timer" data-id="th-modified" ><meta property="og:image" content="https://tiiny.host/assets/logo-purple-bg.png" data-id="th-modified" ><meta property="og:image:width" content="1501" data-id="th-modified" ><meta property="og:image:height" content="1501" data-id="th-modified" ><meta property="og:image:type" content="image/png" data-id="th-modified" ><meta property="og:url" content="https://tomato-bobby-71.tiiny.site/" data-id="th-modified" ><meta property="og:type" content="website" data-id="th-modified" ><script defer data-domain="tomato-bobby-71.tiiny.site" src="https://analytics.tiiny.net/js/plausible.js"></script><script type="text/javascript" src="https://tiiny.host/ad-script.js"></script></head>
<body><main><h1>Kegel Exercise Timer</h1><div id="phase">Ready</div><div id="seconds">10</div><div id="progress">10 contractions · 9 rests</div><div id="track"><div id="fill"></div></div><div id="description">10 seconds contract, 10 seconds relax.<br>One beep at every transition. Total: 3 min 10 sec.</div><button id="start">Start</button><button id="reset" class="secondary">Reset</button><div class="small">Keep this page open and your phone awake to hear the beeps. If audio is muted, raise the volume. Stop if you experience pain or strain.</div></main>
<script>
(()=>{const TOTAL=190,PERIOD=10;let audio,startedAt=0,elapsed=0,running=false,ticker=null,lastPhase=-1,wakeLock=null;
const phase=document.getElementById('phase'),seconds=document.getElementById('seconds'),progress=document.getElementById('progress'),fill=document.getElementById('fill'),start=document.getElementById('start');
function beep(f=880,d=.14,count=1){if(!audio)return;const now=audio.currentTime;for(let i=0;i<count;i++){let osc=audio.createOscillator(),gain=audio.createGain(),t=now+i*.25;osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.23,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+d);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+d+.02)}}
async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function render(t){elapsed=Math.min(TOTAL,t);fill.style.width=(elapsed/TOTAL*100)+'%';if(elapsed>=TOTAL){phase.textContent='Finished!';phase.className='';seconds.textContent='0';progress.textContent='10 of 10 contractions complete';start.textContent='Start again';running=false;clearInterval(ticker);ticker=null;if(wakeLock){wakeLock.release();wakeLock=null}return}
const p=Math.floor(elapsed/PERIOD),isHold=p%2===0,index=Math.floor(p/2)+1;phase.textContent=isHold?'CONTRACT':'RELAX';phase.className=isHold?'hold':'rest';seconds.textContent=String(Math.ceil((p+1)*PERIOD-elapsed));progress.textContent=isHold?`Contraction ${index} of 10`:`Rest ${index} of 9`}
function tick(){const t=(performance.now()-startedAt)/1000, p=Math.min(19,Math.floor(t/10));if(p!==lastPhase){if(p>=19)beep(1050,.16,2);else beep(p%2===0?960:640,.16);lastPhase=p;if(navigator.vibrate)navigator.vibrate(p>=19?[120,120,120]:100)}render(t)}
start.addEventListener('click',async()=>{if(running){elapsed=(performance.now()-startedAt)/1000;running=false;clearInterval(ticker);ticker=null;start.textContent='Resume';if(wakeLock){wakeLock.release();wakeLock=null}return}try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();await audio.resume()}catch(e){}if(elapsed>=TOTAL){elapsed=0;lastPhase=-1}startedAt=performance.now()-elapsed*1000;running=true;start.textContent='Pause';await keepAwake();tick();ticker=setInterval(tick,80)});
document.getElementById('reset').addEventListener('click',()=>{running=false;clearInterval(ticker);ticker=null;elapsed=0;lastPhase=-1;start.textContent='Start';if(wakeLock){wakeLock.release();wakeLock=null}phase.textContent='Ready';phase.className='';seconds.textContent='10';progress.textContent='10 contractions · 9 rests';fill.style.width='0%'});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running){keepAwake();tick()}});
})();
</script></body></html>
